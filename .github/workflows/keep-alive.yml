# Render's free plan puts the backend to sleep after 15 minutes without visitors,
# and waking up takes ~1 minute. This free GitHub Action pings it every 10 minutes
# so it stays awake. (One always-on service fits in Render's 750 free hours/month.)
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl --silent --show-error --fail --max-time 90 --retry 3 --retry-delay 10 https://chatclub-backend-huq4.onrender.com/health
