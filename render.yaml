# Render "Blueprint": tells Render how to run the backend.
# In Render: New + -> Blueprint -> pick this GitHub repo.
services:
  - type: web
    name: chatclub-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Websites allowed to call the backend over HTTP (comma separated).
      - key: ALLOWED_ORIGINS
        value: https://chatclub-app.vercel.app,https://chatclub-rouge.vercel.app,http://localhost:5173
